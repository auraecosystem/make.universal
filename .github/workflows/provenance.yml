name: provenance
on:
  release:
    types: [published]
permissions:
  id-token: write
  contents: read
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: '**/dist/**'
