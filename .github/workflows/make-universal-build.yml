name: make.universal build

on:
  push:
    branches:
      - main
      - repair/**
  pull_request:
    branches:
      - redirect.github.io

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: make build

      - name: Verify
        run: make verify
