name: release
on:
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python3 tools/security/sbom.py
      - run: python3 tools/security/osv.py
      - name: Generate release manifest
        run: |
          mkdir -p security/manifests
          find dist -type f -print0 | xargs -0 -r sha256sum > security/manifests/SHA256SUMS
          find dist -type f -print0 | xargs -0 -r sha512sum > security/manifests/SHA512SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: security/
